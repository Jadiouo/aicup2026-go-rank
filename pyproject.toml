[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicup2026-go-rank"
description = "AI CUP 2026 Go: competition 2, rank prediction (code, trained-weights list, reproduction notebooks)"
version = "0.1.0"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pyyaml>=6",
  "sgfmill>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
torch = ["torch>=2.4"]
speed = ["numba>=0.60"]
plot = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "slow: takes more than 10 seconds",
  "torch: needs torch (skipped if missing)",
  "real_data: reads data/training (skipped if missing)",
  "lgbm: needs lightgbm",
]
